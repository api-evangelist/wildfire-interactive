name: Wildfire Interactive
description: >-
  Wildfire Interactive, Inc. was a social media marketing software company founded in 2008 by
  Victoria Ransom and Alain Chuard in Redwood City, California. Its platform let brands create,
  optimize, and measure their presence across social networks — running branded promotions,
  sweepstakes, contests, and coupons plus page management, advertising, messaging, and analytics
  across Facebook, Twitter, Pinterest, and YouTube. Backed by the Facebook Fund, Summit Partners,
  Accel Partners, and Founders Fund, Wildfire was acquired by Google in 2012 and folded into
  Google's advertising products (DoubleClick); the standalone product was wound down by 2014.
  This profile was surfaced as a portfolio company of uncork-capital and is retained as a
  historical record — the company operates no independent public API surface today.
